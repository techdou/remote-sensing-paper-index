<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="遥感图像分类论文索引：按分区、会议与期刊浏览，查看摘要和下载公开 PDF。">
  <title>遥感图像分类论文索引 · 2023–2026</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><rect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23173f35%22/><path d=%22M16 42c16 0 25-8 32-24-18 1-30 9-32 24Zm4 4c8-10 16-16 25-22%22 fill=%22none%22 stroke=%22%23d7f06d%22 stroke-width=%225%22 stroke-linecap=%22round%22/></svg>">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="app-header">
    <nav class="topbar shell">
      <a class="brand" href="#/" aria-label="遥感论文索引首页">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 4.5h14M3 10h14M3 15.5h9"/><circle cx="15.5" cy="15.5" r="1.5"/></svg>
        <span>遥感论文索引</span>
      </a>
      <div class="top-actions">
        <a href="./遥感图像分类论文合集/下载清单.csv" download>下载清单</a>
        <a class="primary-link" href="./遥感图像分类论文合集/遥感图像分类23-26.xlsx" download>源 Excel</a>
      </div>
    </nav>
    <div class="shell page-heading">
      <div>
        <p class="breadcrumb">研究资料库 <span>/</span> 图像分类 <span>/</span> 2023–2026</p>
        <h1>论文索引</h1>
        <p class="lede">按分区、会议与期刊检索遥感图像分类研究，查看双语摘要与公开全文。</p>
      </div>
      <div class="stats" id="stats"></div>
    </div>
  </header>

  <main class="shell">
    <section class="toolbar" aria-label="论文筛选">
      <div class="toolbar-top">
        <label class="search">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m12.5 12.5 4 4"/></svg>
          <span class="sr-only">搜索论文</span>
          <input id="searchInput" type="search" placeholder="搜索标题、摘要、会议、机制或数据集" autocomplete="off">
        </label>
        <label class="pdf-toggle">
          <input id="pdfOnly" type="checkbox">
          <span>仅公开 PDF</span>
        </label>
      </div>
      <div class="filter-row">
        <div class="filters" id="sheetFilters" role="group" aria-label="按分区筛选"></div>
        <div class="selects">
          <select id="venueFilter" aria-label="按期刊或会议筛选">
            <option value="">全部期刊 / 会议</option>
          </select>
          <select id="yearFilter" aria-label="按年份筛选">
            <option value="">全部年份</option>
          </select>
        </div>
      </div>
    </section>

    <section class="results-head">
      <div>
        <h2 id="resultTitle">全部论文</h2>
        <p class="results-note">点击论文行查看完整摘要、研究信息与来源链接</p>
      </div>
      <p id="resultCount" class="result-count"></p>
    </section>

    <section class="list-shell">
      <div class="list-header" aria-hidden="true">
        <span>论文</span><span>分区</span><span>期刊 / 会议</span><span>年份</span><span>全文</span>
      </div>
      <div id="paperGrid" class="paper-list" aria-live="polite"></div>
    </section>
    <p id="emptyState" class="empty" hidden>没有符合当前条件的论文，请调整筛选条件。</p>
  </main>

  <dialog id="paperDialog">
    <button class="dialog-close" id="dialogClose" aria-label="关闭详情">×</button>
    <article id="dialogContent"></article>
  </dialog>

  <footer>
    <div class="shell footer-inner">
      <p>数据来源于项目 Excel；PDF 仅收录可合法公开访问版本。</p>
      <span>102 条记录 · 2023–2026</span>
    </div>
  </footer>
  <script src="./app.js" defer></script>
</body>
</html>
